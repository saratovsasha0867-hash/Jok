<style>

<div class="scr" id="s0" style="display:flex"><div class="logo">😼</div><h1>Кот против нечисти</h1><div class="hint"><span>WASD / стрелки / палец по экрану — двигаться</span><span>Кот бьёт сам, ты только уворачиваешься</span><span>Убил врага — получил опыт. Новый уровень — выбери 1 из 3</span><span>Ищи лучи света: редкие предметы очень сильные</span></div><button id="go">Играть</button></div>

<div class="scr" id="s2"><h2>Кота съели 😿</h2><div class="tiles" id="res"></div><button id="again">Ещё раз</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),R3=Math.random,A=58,cl=v=>Math.max(-A,Math.min(A,v));
const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c};
const fmt=t=>(t/60|0)+':'+String(t%60|0).padStart(2,'0');

// ---------- 3D мир ----------
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(),SKY=0x8fd0ee;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,28,70);
const cam=new THREE.PerspectiveCamera(50,1,.1,140);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
scene.add(new THREE.AmbientLight(0xffffff,.7));
const sunL=new THREE.DirectionalLight(0xfff0d0,.75);sunL.position.set(-10,20,8);scene.add(sunL);

const gt=new THREE.CanvasTexture(mk(32,32,g=>{g.fillStyle='#4f9d3f';g.fillRect(0,0,32,32);
  for(let i=0;i<110;i++){g.fillStyle=R3()<.5?'#5db34a':'#3f8433';g.fillRect(R3()*32|0,R3()*32|0,2,2)}}));
gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(300,300);gt.magFilter=THREE.NearestFilter;
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({map:gt}));
gnd.rotation.x=-Math.PI/2;scene.add(gnd);

const D=new THREE.Object3D(),cc=new THREE.Color();
function inst(geo,col,n,fn){
  const m=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial({color:col,flatShading:true}),n);
  for(let i=0;i<n;i++){D.position.set(0,0,0);D.rotation.set(0,0,0);D.scale.set(1,1,1);fn(D,i,m);D.updateMatrix();m.setMatrixAt(i,D.matrix)}
  if(m.instanceColor)m.instanceColor.needsUpdate=true;scene.add(m);return m}
// препятствия: круги {x,z,r}, через них нельзя пройти
const OB=[],rp=()=>[(R3()*2-1)*(A+2),(R3()*2-1)*(A+2)];
function spot(rad,pad,rMin){rMin=rMin||9;for(let k=0;k<60;k++){const x=(R3()*2-1)*(A-3),z=(R3()*2-1)*(A-3);
  if(Math.hypot(x,z)>rMin&&OB.every(o=>Math.hypot(o.x-x,o.z-z)>o.r+rad+pad)){const o={x,z,r:rad};OB.push(o);return o}}return null}
const many=(n,rf,pad)=>Array.from({length:n},()=>spot(rf(),pad)).filter(Boolean);
const free=(x,z,m)=>OB.every(o=>Math.hypot(o.x-x,o.z-z)>o.r+m);
const RU=[],PL=[];
for(let c=0;c<3;c++){const o=spot(1.3,6,22);if(!o)continue;RU.push(o);
  for(let k=1;k<9;k++){const a=k/9*6.283+c,p={x:o.x+Math.cos(a)*5,z:o.z+Math.sin(a)*5,r:.9};OB.push(p);PL.push(p)}}
const PO=many(4,()=>5+R3()*3,3),RK=many(50,()=>.9+R3()*1.5,1.2),MU=many(24,()=>.8,1),TR=[];
MU.forEach(o=>o.s=1+R3()*1.2);
for(let i=0;i<55;i++){const s=1.3+R3()*1.2,o=spot(.55*s,1.2);if(o)TR.push([o.x,o.z,s])}
for(let n=0;n<520;){const x=(R3()*2-1)*150,z=(R3()*2-1)*150;if(Math.max(Math.abs(x),Math.abs(z))>A+5){TR.push([x,z,1.3+R3()*1.7]);n++}}
const cg=new THREE.CircleGeometry(1,32).rotateX(-Math.PI/2);
inst(new THREE.PlaneGeometry(5,2*A+8).rotateX(-Math.PI/2),0x9c7a4f,1,d=>d.position.set(0,.02,0));
inst(new THREE.PlaneGeometry(2*A+8,5).rotateX(-Math.PI/2),0x9c7a4f,1,d=>d.position.set(0,.02,0));
inst(cg,0xd8c98c,PO.length,(d,i)=>{d.position.set(PO[i].x,.03,PO[i].z);d.scale.setScalar(PO[i].r+1)});
inst(cg,0x3f86d8,PO.length,(d,i)=>{d.position.set(PO[i].x,.06,PO[i].z);d.scale.setScalar(PO[i].r)});
inst(cg,0x8d8d84,RU.length,(d,i)=>{d.position.set(RU[i].x,.04,RU[i].z);d.scale.setScalar(6.5)});
inst(new THREE.CylinderGeometry(.9,1.2,1.2,8),0x6f6f78,RU.length,(d,i)=>d.position.set(RU[i].x,.6,RU[i].z));
inst(new THREE.OctahedronGeometry(.5),0x66eeee,RU.length,(d,i)=>d.position.set(RU[i].x,1.9,RU[i].z));
inst(new THREE.BoxGeometry(1.5,1,1.5),0xb3b0a2,PL.length,(d,i)=>{const h=2.5+R3()*2.5;d.position.set(PL[i].x,h/2,PL[i].z);d.scale.set(1,h,1);d.rotation.y=R3()});
inst(new THREE.DodecahedronGeometry(1),0x8b8f98,RK.length,(d,i)=>{const o=RK[i],sy=.6+R3()*.6;d.position.set(o.x,o.r*sy*.55,o.z);d.scale.set(o.r*1.05,o.r*sy,o.r*1.05);d.rotation.y=R3()*6});
inst(new THREE.DodecahedronGeometry(.16),0x9a9ea6,260,d=>{const p=rp();d.position.set(p[0],.1,p[1]);d.scale.set(1+R3(),.6,1+R3())});
inst(new THREE.CylinderGeometry(.22,.3,1.3,6),0xf1e8d0,MU.length,(d,i)=>{d.position.set(MU[i].x,.65*MU[i].s,MU[i].z);d.scale.setScalar(MU[i].s)});
inst(new THREE.SphereGeometry(1,10,6,0,6.283,0,1.6),0xd8393a,MU.length,(d,i)=>{const s=MU[i].s;d.position.set(MU[i].x,1.3*s,MU[i].z);d.scale.set(1.1*s,.8*s,1.1*s)});
const FL=[];while(FL.length<900){const p=rp();if(free(p[0],p[1],.3))FL.push(p)}
inst(new THREE.CylinderGeometry(.02,.02,.4,4),0x3c8a34,FL.length,(d,i)=>d.position.set(FL[i][0],.2,FL[i][1]));
inst(new THREE.SphereGeometry(.13,6,5),0xffffff,FL.length,(d,i,m)=>{d.position.set(FL[i][0],.42,FL[i][1]);m.setColorAt(i,cc.setHex([0xff5a7a,0xffe14d,0xffffff,0xb98cff,0xff9a3c][i%5]))});
inst(new THREE.ConeGeometry(.13,.8,4),0x5db34a,700,d=>{const p=rp();d.position.set(p[0],.4,p[1]);d.scale.set(1,.7+R3()*.8,1);d.rotation.y=R3()*3});
inst(new THREE.CylinderGeometry(.35,.5,2,6),0x7a5230,TR.length,(d,i)=>{const t=TR[i];d.position.set(t[0],t[2],t[1]);d.scale.setScalar(t[2])});
inst(new THREE.ConeGeometry(1.7,3.2,7),0x2f7d32,TR.length,(d,i)=>{const t=TR[i];d.position.set(t[0],t[2]*3.3,t[1]);d.scale.setScalar(t[2]);d.rotation.y=i});
inst(new THREE.ConeGeometry(1.2,2.4,7),0x3f9c45,TR.length,(d,i)=>{const t=TR[i];d.position.set(t[0],t[2]*5,t[1]);d.scale.setScalar(t[2])});
const BU=[];for(let t=-A-3;t<=A+3;t+=2){BU.push([t,-A-1.5],[t,A+1.5],[-A-1.5,t],[A+1.5,t])}
inst(new THREE.BoxGeometry(2,1.3,2),0x2d6a2f,BU.length,(d,i)=>{d.position.set(BU[i][0],.65,BU[i][1]);d.scale.set(1,.8+R3()*.6,1);d.rotation.y=R3()});

// ---------- 2D-спрайты (рисуем на canvas, стоят в 3D-сцене как плоскости-билборды) ----------
const tx=fn=>new THREE.CanvasTexture(mk(128,128,g=>{g.scale(2,2);g.lineJoin=g.lineCap='round';g.lineWidth=2.6;g.strokeStyle='#241612';fn(g)}));
const ell=(g,x,y,a,b,f,r)=>{g.beginPath();g.ellipse(x,y,a,b,r||0,0,7);g.fillStyle=f;g.fill();g.stroke()};
const poly=(g,p,f)=>{g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fillStyle=f;g.fill();g.stroke()};
const rg=(g,x,y,r,a,b)=>{const q=g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.1);q.addColorStop(0,a);q.addColorStop(1,b);return q};
const ln=(g,...p)=>{g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.stroke()};
const dot=(g,x,y,r,f)=>{g.fillStyle=f;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
const eye=(g,x,y,a,b)=>{ell(g,x,y,a,b,'#fff');dot(g,x+.6,y+.6,a*.62,'#241612');dot(g,x-a*.15,y-b*.3,1,'#fff')};
const TX={
 cat:tx(g=>{
  g.beginPath();g.moveTo(44,50);g.bezierCurveTo(62,52,66,36,56,24);g.lineWidth=8.5;g.stroke();g.lineWidth=5.2;g.strokeStyle='#f0922a';g.stroke();
  g.strokeStyle='#8a4a10';g.setLineDash([2,5]);g.stroke();g.setLineDash([]);g.lineWidth=2.6;g.strokeStyle='#241612';
  ell(g,22,58,6,3.5,'#fff3dc');ell(g,42,58,6,3.5,'#fff3dc');
  ell(g,32,46,15,13,rg(g,32,46,15,'#ffb44d','#e07a12'));ell(g,32,51,8,7.5,'#fff3dc');
  poly(g,[[19,38],[32,42],[45,38],[43,44],[32,47],[21,44]],'#d93a3a');
  ell(g,18,47,4,6,'#f0922a',.3);ell(g,46,47,4,6,'#f0922a',-.3);
  poly(g,[[13,27],[13,3],[29,16]],'#f0922a');poly(g,[[51,27],[51,3],[35,16]],'#f0922a');
  poly(g,[[16,22],[16,9],[25,16]],'#ff9db0');poly(g,[[48,22],[48,9],[39,16]],'#ff9db0');
  ell(g,32,29,19,15.5,rg(g,32,29,19,'#ffb44d','#e07a12'));

// ---------- управление: клавиатура и плавающий джойстик (мышь или палец) ----------
const ring=$('ring'),st=$('st');let jp=null,jo=null;
const setJ=(x,y)=>{ring.style.left=st.style.left=x+'px';ring.style.top=st.style.top=y+'px'};
cv.addEventListener('pointerdown',e=>{if(jp!==null)return;e.preventDefault();jp=e.pointerId;jo=[e.clientX,e.clientY];
  cv.setPointerCapture(jp);ring.style.display=st.style.display='block';setJ(jo[0],jo[1])});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==jp)return;
  const dx=e.clientX-jo[0],dy=e.clientY-jo[1],l=Math.hypot(dx,dy)||1,m=Math.min(l,55);
  J.x=l<8?0:dx/l*m/55;J.y=l<8?0:dy/l*m/55;st.style.left=jo[0]+dx/l*m+'px';st.style.top=jo[1]+dy/l*m+'px'});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{if(e.pointerId!==jp)return;
  jp=null;J.x=J.y=0;ring.style.display=st.style.display='none'}));
$('go').onclick=()=>{$('s0').style.display='none';reset()};
$('again').onclick=()=>{$('s2').style.display='none';reset()};
requestAnimationFrame(tick);
</script></body></html>
